<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Complex Nutrition thumbnail</title>
<style>
  @font-face { font-family: 'Lato'; font-weight: 400; src: url(fonts/Lato-400.ttf); }
  @font-face { font-family: 'Lato'; font-weight: 700; src: url(fonts/Lato-700.ttf); }
  @font-face { font-family: 'Lato'; font-weight: 900; src: url(fonts/Lato-900.ttf); }
  html, body { margin: 0; background: #222; }
  svg { display: block; }
</style>
</head>
<body>
<svg id="art" width="1024" height="1024" viewBox="0 0 1024 1024"></svg>
<script src="vs.js"></script>
<script>
// A blocky Vintage Story character in the Vitruvian pose, shown in a game-style dialog with food in the hotbar.
// 1024x1024; render.js also exports 512 px and the 256 px mod icon.
(async () => {
await Promise.all(['900 64px Lato', '700 24px Lato', '400 24px Lato'].map(f => document.fonts.load(f)));
const W = 1024, H = 1024;
const svg = document.getElementById('art');

// ---- dialog ----
panel(svg, 0, 0, W, H, 11, 12);
text(svg, W / 2, 100, 'Complex Nutrition', { 'text-anchor': 'middle', 'font-weight': 900, 'font-size': 84 });
const IN = { x: 52, y: 140, w: W - 104, h: 694 };
inset(svg, IN.x, IN.y, IN.w, IN.h, 12, 12);

// ---- figure geometry, in texels (T px each). Head 11, torso 22, legs 31: 64 tall, arm span 64 ----
const T = 8;
const C = { x: W / 2, y: IN.y + IN.h / 2 + 6 };    // navel: centre of the circle
const NAVEL_ROW = 27;
const top = C.y - NAVEL_ROW * T;                    // top of the head
const X = u => C.x + u * T, Y = v => top + v * T;   // body texel coords -> px
const R = 38.1 * T;                                 // reaches the raised hands and the spread feet
const ANGLE = 25;                                   // degrees: arms raised, legs spread

// circle and square, like the drawing, in the UI's beige
const lines = el('g', { fill: 'none', stroke: VS.text, 'stroke-opacity': 0.55, 'stroke-width': 4 }, svg);
el('circle', { cx: C.x, cy: C.y, r: R }, lines);
el('rect', { x: X(-32), y: Y(0), width: 64 * T, height: 64 * T }, lines);
const faint = el('g', { stroke: VS.text, 'stroke-opacity': 0.16, 'stroke-width': 2 }, svg);
el('line', { x1: C.x, y1: C.y - R - 18, x2: C.x, y2: C.y + R + 18 }, faint);
el('line', { x1: C.x - R - 18, y1: Y(13.5), x2: C.x + R + 18, y2: Y(13.5) }, faint);
el('line', { x1: X(-32), y1: Y(0), x2: X(32), y2: Y(64) }, faint);
el('line', { x1: X(32), y1: Y(0), x2: X(-32), y2: Y(64) }, faint);
// measuring ticks round the circle
for (let a = 0; a < 360; a += 10) {
  const r = a * Math.PI / 180, l = a % 30 === 0 ? 16 : 8;
  el('line', { x1: C.x + R * Math.sin(r), y1: C.y - R * Math.cos(r), x2: C.x + (R - l) * Math.sin(r), y2: C.y - (R - l) * Math.cos(r), stroke: VS.text, 'stroke-opacity': 0.4, 'stroke-width': 3 }, svg);
}

// Texture palettes: skin tone and breeches from the game's character creator.
const SKIN = { base: ['#b6a361', '#b6a361', '#bba866', '#ae9c5c', '#c0ad6b', '#b3a05f'], dark: '#9e8d50', light: '#c9b777' };
const CLOTH = { base: ['#cecbbb', '#cecbbb', '#d8d5c6', '#c4c1b1', '#e0ddd0', '#bdb9a9'], dark: '#a9a595', light: '#e6e3d8' };

// One box face of w x h texels at local (0,0), shaded darker on the right and bottom edges.
// `rowStyle(row)` picks SKIN or CLOTH per texel row; `paint(col,row)` can override single texels.
function box(parent, w, h, seed, rowStyle, paint) {
  const g = el('g', { 'shape-rendering': 'crispEdges' }, parent);
  const r = rng(seed);
  for (let v = 0; v < h; v++) {
    for (let u = 0; u < w; u++) {
      const st = rowStyle(v);
      let c = st.base[Math.floor(r() * st.base.length)];
      if (u === w - 1 || v === h - 1) c = st.dark;
      else if (u === 0) c = st.light;
      const p = paint && paint(u, v);
      if (p) c = p;
      el('rect', { x: u * T, y: v * T, width: T + 0.5, height: T + 0.5, fill: c }, g);
    }
  }
  el('rect', { x: 0, y: 0, width: w * T, height: h * T, fill: 'none', stroke: '#2a2016', 'stroke-opacity': 0.55, 'stroke-width': 2 }, g);
  return g;
}
const skin = () => SKIN;
function group(parent, x, y, rot, px, py) {   // translate to (x,y), rotate `rot` degrees about local (px,py)
  return el('g', { transform: `translate(${x},${y}) rotate(${rot},${px},${py})` }, parent);
}

// arm: 24 x 5 texels lying horizontally; `side` -1 left, +1 right. Pivot at the shoulder (inner end, middle).
function arm(parent, side, rot, seed) {
  const g = side < 0
    ? group(parent, X(-32), Y(11), rot, 24 * T, 2.5 * T)
    : group(parent, X(8), Y(11), rot, 0, 2.5 * T);
  box(g, 24, 5, seed, skin, (u, v) => {
    const hand = side < 0 ? u < 3 : u > 20;            // a slightly darker band for the hand
    return hand && v > 0 && v < 4 && u % 2 === 0 ? '#a99656' : null;
  });
}
// leg: 8 x 31 texels, pivot at the hip (top middle). Breeches cover the top 7 rows.
function leg(parent, side, rot, seed) {
  const g = group(parent, side < 0 ? X(-8) : X(0), Y(33), rot, 4 * T, 0);
  box(g, 8, 31, seed, v => (v < 7 ? CLOTH : SKIN), (u, v) => (v === 6 ? CLOTH.dark : null));
}

// pose 2 (arms up, legs apart) first and faded, then pose 1 on top, as in Leonardo's drawing
const ghost = el('g', { opacity: 0.5 }, svg);
arm(ghost, -1, ANGLE, 21);
arm(ghost, 1, -ANGLE, 22);
leg(ghost, -1, ANGLE, 23);
leg(ghost, 1, -ANGLE, 24);

const fig = el('g', {}, svg);
arm(fig, -1, 0, 31);
arm(fig, 1, 0, 32);
leg(fig, -1, 0, 33);
leg(fig, 1, 0, 34);
// torso: 16 x 22 texels, breeches from row 18 down, navel at row 16
box(group(fig, X(-8), Y(11), 0, 0, 0), 16, 22, 35, v => (v >= 18 ? CLOTH : SKIN), (u, v) => {
  if (v === 16 && (u === 7 || u === 8)) return u === 7 ? '#8f7f47' : '#a08f52';    // navel
  if (v === 6 && u > 1 && u < 14 && u !== 7 && u !== 8) return '#a99656';         // chest line
  if (v === 18 && u < 15) return CLOTH.light;                                       // waistband
  if (v === 21 && u === 7) return CLOTH.dark;                                       // seam
  return null;
});
// head: 10 x 11 texels, with short hair and a pixel face
const HAIR = ['#5b3b22', '#65432a', '#523420'];
const FACE = {
  '2,4': '#3b2a1e', '3,4': '#3b2a1e', '6,4': '#3b2a1e', '7,4': '#3b2a1e',          // brows
  '2,5': '#f2efe6', '3,5': '#2f6f73', '6,5': '#2f6f73', '7,5': '#f2efe6',          // eyes
  '4,7': '#a39152', '5,7': '#a39152',                                               // nose shadow
  '3,8': '#3f7f80', '4,8': '#3f7f80', '5,8': '#3f7f80', '6,8': '#3f7f80',          // mouth
};
const HAIR_LIGHT = '#7f5836', HAIR_EDGE = '#3a2414';
// Draws hair texels in body texel coords for every (u,v) where inside(u,v); vertical strands, dark outline.
function hair(parent, u0, u1, v0, v1, inside, seed) {
  const g = el('g', { 'shape-rendering': 'crispEdges' }, parent);
  const r = rng(seed);
  for (let v = v0; v < v1; v++) {
    for (let u = u0; u < u1; u++) {
      if (!inside(u, v)) continue;
      const edge = !inside(u - 1, v) || !inside(u + 1, v) || !inside(u, v + 1);
      let c = HAIR[Math.floor(r() * HAIR.length)];
      if ((u + 40) % 3 === 1 && r() > 0.25) c = HAIR_LIGHT;    // strands catching the light
      if (edge) c = HAIR_EDGE;
      el('rect', { x: X(u), y: Y(v), width: T + 0.5, height: T + 0.5, fill: c }, g);
    }
  }
}
// back of the hair, framing the head
hair(fig, -7, 7, -1, 11, (u, v) => u >= -7 && u < 7 && v >= -1 && v < 11 && !(v === -1 && (u < -5 || u > 4)), 43);
const hr = rng(41);
box(group(fig, X(-5), Y(0), 0, 0, 0), 10, 11, 42, skin, (u, v) => {
  if (v < 2 || (v === 2 && (u < 3 || u > 6)) || (v === 3 && (u === 0 || u === 9))) return HAIR[Math.floor(hr() * HAIR.length)];
  return FACE[u + ',' + v] || null;
});
// long locks falling forward over the shoulders, with uneven ends and a little flare at the bottom
// left side as [column, first row, end row]; the right side mirrors it (u -> -1 - u)
const LOCK = { '-10': [12, 16], '-9': [10, 21], '-8': [8, 25], '-7': [2, 28], '-6': [2, 30], '-5': [2, 27], '-4': [3, 22] };
const inLock = (u, v) => {
  const s = LOCK[u < 0 ? u : -1 - u];
  return !!s && v >= s[0] && v < s[1];
};
hair(fig, -10, 10, 2, 30, inLock, 44);

// ---- health and satiety bars, then the hotbar with food in it ----
const barY = IN.y + IN.h + 20, segW = 30, segs = 12;
for (let i = 0; i < segs; i++) {
  el('rect', { x: 92 + i * segW, y: barY, width: segW - 3, height: 16, fill: VS.health, stroke: '#4a0a0b', 'stroke-width': 2 }, svg);
  el('rect', { x: W - 92 - segs * segW + i * segW + 3, y: barY, width: segW - 3, height: 16, fill: VS.satiety, stroke: '#38401a', 'stroke-width': 2 }, svg);
}
const FOODS = ['apple', 'bread', 'carrot', 'meat', 'fish', 'cheese', 'mushroom'];
const S = 108, GAP = 14, x0 = (W - (FOODS.length * S + (FOODS.length - 1) * GAP)) / 2, sy = barY + 34;
FOODS.forEach((f, i) => {
  const x = x0 + i * (S + GAP);
  slot(svg, x, sy, S, { number: i + 1, ring: i === 0 ? VS.selected : null });
  sprite(svg, f, x + (S - 80) / 2, sy + (S - 80) / 2 + 2, 5);
});

document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
